<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A DSH conversation reading an existing Codex session and handing it the next instruction">
  <defs>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c2a5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#35c2a5" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- left: the DSH conversation -->
  <rect x="44" y="58" width="228" height="184" rx="16" fill="url(#tint)" stroke="#6ea8fe" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="68" y="86" width="150" height="13" rx="6.5" fill="#6ea8fe" fill-opacity="0.42"/>
  <rect x="68" y="108" width="112" height="13" rx="6.5" fill="#94a3b8" fill-opacity="0.36"/>
  <rect x="68" y="130" width="180" height="13" rx="6.5" fill="#94a3b8" fill-opacity="0.24"/>
  <rect x="96" y="166" width="152" height="30" rx="15" fill="#6ea8fe" fill-opacity="0.18" stroke="#6ea8fe" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="112" y="179" width="94" height="5" rx="2.5" fill="#6ea8fe" fill-opacity="0.7"/>

  <!-- right: the existing Codex session -->
  <rect x="368" y="58" width="228" height="184" rx="16" fill="url(#mint)" stroke="#35c2a5" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M394 104 l16 12 -16 12" fill="none" stroke="#35c2a5" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420" y="108" width="58" height="8" rx="4" fill="#35c2a5" fill-opacity="0.55"/>
  <rect x="394" y="146" width="164" height="9" rx="4.5" fill="#94a3b8" fill-opacity="0.34"/>
  <rect x="394" y="166" width="128" height="9" rx="4.5" fill="#94a3b8" fill-opacity="0.26"/>
  <rect x="394" y="186" width="148" height="9" rx="4.5" fill="#94a3b8" fill-opacity="0.18"/>
  <rect x="394" y="206" width="96" height="9" rx="4.5" fill="#94a3b8" fill-opacity="0.12"/>

  <!-- the bridge -->
  <path d="M276 150 H 306" fill="none" stroke="#7c8aa0" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M338 150 H 364" fill="none" stroke="#7c8aa0" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M356 142 l10 8 -10 8 z" fill="#7c8aa0" fill-opacity="0.85"/>
  <circle cx="322" cy="150" r="17" fill="#7c8aa0" fill-opacity="0.12" stroke="#7c8aa0" stroke-opacity="0.7" stroke-width="1.5"/>
  <g fill="none" stroke="#7c8aa0" stroke-opacity="0.95" stroke-width="2" stroke-linecap="round">
    <path d="M316 154.5a6.5 6.5 0 0 1 0-9.2l3.4-3.4a6.5 6.5 0 0 1 9.2 9.2l-1.6 1.6"/>
    <path d="M328 145.5a6.5 6.5 0 0 1 0 9.2l-3.4 3.4a6.5 6.5 0 0 1-9.2-9.2l1.6-1.6"/>
  </g>
</svg>
